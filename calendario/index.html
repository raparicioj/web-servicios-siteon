<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Mi Calendario — Temporalmente Fuera de Servicio</title>
    <script>
      (async function () {
        try {
          if ('serviceWorker' in navigator) {
            const regs = await navigator.serviceWorker.getRegistrations();
            for (const r of regs) {
              await r.unregister();
            }
          }
          if ('caches' in window) {
            const keys = await caches.keys();
            for (const k of keys) {
              await caches.delete(k);
            }
          }
        } catch (e) {}
      })();
    </script>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0f172a;
        color: #f8fafc;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        padding: 24px;
        text-align: center;
      }
      .card {
        max-width: 420px;
        width: 100%;
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 20px;
        padding: 36px 28px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      }
      .icon {
        font-size: 42px;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 20px;
        font-weight: 700;
        margin-bottom: 10px;
        color: #ffffff;
      }
      p {
        font-size: 14px;
        line-height: 1.6;
        color: #94a3b8;
      }
      .badge {
        display: inline-block;
        margin-top: 20px;
        padding: 6px 14px;
        border-radius: 999px;
        background: rgba(244, 63, 94, 0.15);
        border: 1px solid rgba(244, 63, 94, 0.35);
        color: #fda4af;
        font-size: 12px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">⏸️</div>
      <h1>Aplicación Temporalmente en Pausa</h1>
      <p>
        Mi Calendario y todas sus notificaciones automáticas se encuentran temporalmente deshabilitados por mantenimiento.
      </p>
      <span class="badge">Servicio Pausado</span>
    </div>
  </body>
</html>
