<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="50%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFE4E6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#881337" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Rounded App Background -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner glow overlay -->
  <rect x="4" y="4" width="184" height="184" rx="38" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>

  <!-- Calendar Base Plate -->
  <g filter="url(#shadow)">
    <!-- Main Heart & Calendar Shape -->
    <path d="M96 150 C96 150, 42 114, 42 74 C42 54, 58 38, 78 38 C88 38, 93 43, 96 48 C99 43, 104 38, 114 38 C134 38, 150 54, 150 74 C150 114, 96 150, 96 150 Z" 
          fill="url(#heartGrad)"/>
          
    <!-- Sparkle Stars -->
    <path d="M142 34 L145 42 L153 45 L145 48 L142 56 L139 48 L131 45 L139 42 Z" fill="#FDE047"/>
    <path d="M48 128 L50 133 L55 135 L50 137 L48 142 L46 137 L41 135 L46 133 Z" fill="#FDE047"/>

    <!-- Small Heart Icon In Center -->
    <path d="M96 98 C96 98, 76 82, 76 68 C76 60, 82 54, 90 54 C94 54, 95 56, 96 58 C97 56, 98 54, 102 54 C110 54, 116 60, 116 68 C116 82, 96 98, 96 98 Z" 
          fill="#E11D48"/>
  </g>
</svg>
