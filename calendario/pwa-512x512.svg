<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="50%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFE4E6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#881337" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded App Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner glow overlay -->
  <rect x="10" y="10" width="492" height="492" rx="102" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="5"/>

  <!-- Calendar Base Plate -->
  <g filter="url(#shadow)">
    <!-- Main Heart & Calendar Shape -->
    <path d="M256 400 C256 400, 112 304, 112 197 C112 144, 155 101, 208 101 C235 101, 248 115, 256 128 C264 115, 277 101, 304 101 C357 101, 400 144, 400 197 C400 304, 256 400, 256 400 Z" 
          fill="url(#heartGrad)"/>
          
    <!-- Sparkle Stars -->
    <path d="M378 90 L386 112 L408 120 L386 128 L378 150 L370 128 L348 120 L370 112 Z" fill="#FDE047"/>
    <path d="M128 340 L133 354 L147 359 L133 364 L128 378 L123 364 L109 359 L123 354 Z" fill="#FDE047"/>

    <!-- Small Heart Icon In Center -->
    <path d="M256 262 C256 262, 202 219, 202 181 C202 160, 219 144, 240 144 C251 144, 253 149, 256 155 C259 149, 261 144, 272 144 C293 144, 310 160, 310 181 C310 219, 256 262, 256 262 Z" 
          fill="#E11D48"/>
  </g>
</svg>
